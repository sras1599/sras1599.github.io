name: Pull request dependencies

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  npm-dependency-install:
    name: npm dependency install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies with strict peer checks
        run: npm ci --strict-peer-deps
