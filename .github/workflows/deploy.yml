name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cover the entire build and deploy, not just the final upload.
concurrency:
  group: website-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VAULT_PATH: ${{ github.workspace }}/.vault-checkout
    steps:
      - name: Checkout website
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout private vault
        uses: actions/checkout@v7
        with:
          repository: sras1599/obsidian
          ref: main
          path: .vault-checkout
          token: ${{ secrets.VAULT_READ_TOKEN }}
          persist-credentials: false
      - name: Record vault revision
        run: git -C "$VAULT_PATH" rev-parse HEAD
      - name: Install, build, and upload site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
